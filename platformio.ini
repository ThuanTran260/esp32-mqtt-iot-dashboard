; PlatformIO Project Configuration File
; Project: Integrated IoT System - ESP32 Wokwi Simulation

[platformio]
src_dir = esp32_wokwi
include_dir = esp32_wokwi

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient @ ^2.8
    beegee-tokyo/DHT sensor library for ESPx @ ^1.19
    bblanchon/ArduinoJson @ ^6.21.4

; TEMPORARY SPIKE S0 (Wokwi TCP reachability) - remove after the spike.
; Overrides only mqtt_server. For the LAN case (B) change the host to the
; other machine's IPv4, e.g. -DSPIKE_HOST=\"192.168.43.10\"
[env:spike]
extends = env:esp32doit-devkit-v1
build_flags = -DSPIKE_HOST=\"host.wokwi.internal\"
